<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage My Shifts - Login</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <form id="login-form">
    <h1>Login</h1>

    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>
    <div class="password-field">
      <input type="password" id="password" name="password" required>
      <button type="button" class="toggle-password" data-target="password" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
    </div>
    <button type="button" id="register">Don't have an account?</button>
    <button type="button" id="forgot-password">Forgot Password?</button>

    <p id="error-message"></p>

    <button type="submit">Login</button>
  </form>

  <script src="../js/storage.js"></script>
  <script src="../js/password-toggle.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
