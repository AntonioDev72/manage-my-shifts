<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage My Shifts - Edit Profile</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <form id="edit-profile-form">
    <h1>Edit Profile</h1>

    <label for="first-name">First Name:</label>
    <input type="text" id="first-name" name="first-name" required>

    <label for="last-name">Last Name:</label>
    <input type="text" id="last-name" name="last-name" required>

    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="birthDate">Birth Date:</label>
    <input type="date" id="birthDate" name="birthDate" required>

    <label for="password">Password:</label>
    <div class="password-field">
      <input type="password" id="password" name="password" required>
      <button type="button" class="toggle-password" data-target="password" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
    </div>

    <label for="confirm-password">Confirm Password:</label>
    <div class="password-field">
      <input type="password" id="confirm-password" name="confirm-password" required>
      <button type="button" class="toggle-password" data-target="confirm-password" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
    </div>

    <p id="error-message"></p>

    <button type="submit">Update</button>
  </form>

  <script src="../js/storage.js"></script>
  <script src="../js/password-toggle.js"></script>
  <script src="../js/edit-profile.js"></script>
</body>
</html>
