<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <h1>Register</h1>

  <label for="email">Email</label>
  <input id="email" type="email" formControlName="email">

  <label for="password">Password</label>
  <div class="password-field">
    <input #passwordRef id="password" type="password" formControlName="password">
    <button type="button" class="toggle-password" (click)="passwordRef.type = passwordRef.type === 'password' ? 'text' : 'password'" [attr.aria-label]="passwordRef.type === 'password' ? 'Show password' : 'Hide password'">
      @if (passwordRef.type === 'password') { <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> } @else { <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg> }
    </button>
  </div>

  <label for="confirmPassword">Confirm Password</label>
  <div class="password-field">
    <input #confirmPasswordRef id="confirmPassword" type="password" formControlName="confirmPassword">
    <button type="button" class="toggle-password" (click)="confirmPasswordRef.type = confirmPasswordRef.type === 'password' ? 'text' : 'password'" [attr.aria-label]="confirmPasswordRef.type === 'password' ? 'Show password' : 'Hide password'">
      @if (confirmPasswordRef.type === 'password') { <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> } @else { <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg> }
    </button>
  </div>

  <label for="firstName">First Name</label>
  <input id="firstName" type="text" formControlName="firstName">

  <label for="lastName">Last Name</label>
  <input id="lastName" type="text" formControlName="lastName">

  <label for="birthDate">Birth Date</label>
  <input id="birthDate" type="date" formControlName="birthDate">
  @if (registerForm.get('birthDate')?.hasError('ageRange') && registerForm.get('birthDate')?.touched) {
    <p id="error-message">Age must be between 6 and 130 years old.</p>
  }

  <button type="button" id="login-link" (click)="goToLogin()">Already have an account?</button>

  <p id="error-message">{{ errorMessage }}</p>

  <button type="submit">Register</button>
</form>
